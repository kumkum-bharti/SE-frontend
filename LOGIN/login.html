<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../loadConfigs.js"></script> <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            margin: 0;
        }
        .login-container {
            display: flex;
            width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .login-form {
            flex: 1;
            padding: 50px;
        }
        .login-form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .login-form .form-control {
            border-radius: 25px;
        }
        .login-form .btn {
            width: 100%;
            border-radius: 25px;
            background: #6a11cb;
            border: none;
        }
        .login-form .btn:hover {
            background: #2575fc;
        }
        .login-image {
            flex: 1;
            background: linear-gradient(45deg, #2575fc, #6a11cb);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

.password-container {
    position: relative;
    width: 100%;
    
}

.password-container input {
    width: 100%;
    padding-right: 40px; /* Space for eye icon */
    
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 70%;
    transform: translateY(-50%);
    cursor: pointer;
}

.toggle-password img {
    position: absolute;
    top: -1rem;
    right: 10px;
    width: 20px;
    height: 20px;
    opacity: 0.7;
    transition: opacity 0.3s ease;
}

.toggle-password img:hover {
    opacity: 1;
}
</style>

</head>

</header>
<div class="login-container">
    <div class="login-form">
        <h2>Welcome Back!</h2>
        <form action="/HOMEPAGE/home.html" method="POST">
            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3 password-container">
                <input type="password" class="form-control" placeholder="Password" id="password"  required>
                <span class="toggle-password">
                    <img id="eye-icon" src="https://cdn-icons-png.flaticon.com/512/709/709612.png" alt="Show Password">
                </span>
            </div> 
            <div class="text-center">
                <button type="submit" class="btn btn-primary" onclick="loginUser()" >
                  <i class="fa-solid fa-user me-1"></i>  Login
                </button>
            </div>  

            <p class="mt-3 text-center">Don't have an account? <a href="/SE-frontend/signup.html">Register!</a></p>

        </form>
    </div>
    <div class="login-image">
        Welcome Back! <br> Your journey continues here.
    </div>
  </form>
</div>
 
</body>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const passwordField = document.getElementById("password");
    const eyeIcon = document.getElementById("eye-icon");

    eyeIcon.addEventListener("click", function() {
        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.src = "https://cdn-icons-png.flaticon.com/512/159/159604.png"; 
        } else {
            passwordField.type = "password";
            eyeIcon.src = "https://cdn-icons-png.flaticon.com/512/709/709612.png"; 
        }
    });
});


async function loginUser() {
    event.preventDefault();
    const userData = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    const response = await fetch(window.APP_CONFIG.baseUrl+"api/v1.0/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" 
            ,"ngrok-skip-browser-warning": "69420"
        },
        body: JSON.stringify(userData)
    });

    const data = await response.json(); // Parse response body as JSON
    
    if (response.ok) {
        console.log(data);
        localStorage.setItem("token", data.token); // Save token
        alert("Login successful!");
        localStorage.setItem("isLoggedIn", "true");
        window.location.href="/HOMEPAGE/home.html";
    } else if(response.status == 400) {
        console.log(data);
        alert(`Error: ${data.Message}`);
        window.location.href="/LOGIN/login.html";
    }
}


</script>
</html>
